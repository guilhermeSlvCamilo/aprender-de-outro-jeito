
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprender de Outro Jeito</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  color: #243047;
  line-height: 1.6;
}

.container {
  max-width: 800px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 30px;
}

h1 {
  color: #315b9d;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.05);
}

textarea {
  width: 100%;
  min-height: 180px;
  padding: 15px;
  font: inherit;
  border: 1px solid #ccd4e0;
  border-radius: 10px;
  resize: vertical;
}

button {
  background: #315b9d;
  color: white;
  padding: 14px 20px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
  margin-top: 15px;
}

button:hover {
  background: #244679;
}

.step {
  border-left: 4px solid #84a9e4;
  padding: 15px;
  margin: 15px 0;
  background: #f7f9fd;
  border-radius: 8px;
}

.keyword {
  display: inline-block;
  background: #e8efff;
  color: #315b9d;
  padding: 6px 12px;
  margin: 5px;
  border-radius: 20px;
}

.hidden {
  display: none;
}

footer {
  text-align: center;
  color: #65748a;
  font-size: 13px;
  padding: 20px;
}

@media (max-width: 600px) {
  body {
    padding: 12px;
  }

  .card {
    padding: 18px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
<h1>Aprender de Outro Jeito</h1>
<p>Transformando conteúdos em etapas mais acessíveis.</p>
</header>

<section class="card">
<h2>Vamos aprender?</h2>
<p>Insira um conteúdo escolar para organizá-lo em pequenas etapas.</p>

<textarea id="content" placeholder="Cole aqui o conteúdo que você precisa estudar..."></textarea>

<button id="organize">Organizar meu aprendizado</button>
<p id="error" role="alert"></p>
</section>

<section id="results" class="hidden">

<div class="card">
<h2>Seu roteiro de aprendizagem</h2>
<p id="intro"></p>
<div id="steps"></div>
</div>

<div class="card">
<h2>Palavras importantes</h2>
<div id="keywords"></div>
</div>

<div class="card">
<h2>Vamos revisar?</h2>
<div id="questions"></div>
</div>

<div class="card">
<h2>Hora de lembrar</h2>
<p id="review"></p>
</div>

<div class="card">
<p id="disclaimer"></p>
</div>

<button onclick="window.print()">Salvar ou imprimir</button>

</section>

<footer>
Aprender de Outro Jeito — Projeto open source.
</footer>

</div>

<script src="engine.js"></script>

<script>
const button = document.getElementById("organize");

button.addEventListener("click", function() {
  const content = document.getElementById("content").value;
  const error = document.getElementById("error");
  const results = document.getElementById("results");

  error.textContent = "";
  results.classList.add("hidden");

  const output = window.ADJEngine.generate(content);

  if (output.error) {
    error.textContent = output.error;
    return;
  }

  document.getElementById("intro").textContent =
    output.introduction;

  const stepsContainer = document.getElementById("steps");
  stepsContainer.replaceChildren();

  output.steps.forEach((step, index) => {
    const div = document.createElement("div");
    div.className = "step";

    const title = document.createElement("h3");
    title.textContent = "Etapa " + (index + 1);

    const paragraph = document.createElement("p");
    paragraph.textContent = step;

    div.append(title, paragraph);
    stepsContainer.appendChild(div);
  });

  const keywordContainer =
    document.getElementById("keywords");

  keywordContainer.replaceChildren();

  output.keywords.forEach(word => {
    const span = document.createElement("span");
    span.className = "keyword";
    span.textContent = word;
    keywordContainer.appendChild(span);
  });

  const questionsContainer =
    document.getElementById("questions");

  questionsContainer.replaceChildren();

  output.questions.forEach((item, index) => {
    const div = document.createElement("div");
    div.className = "step";

    const title = document.createElement("h3");
    title.textContent = "Desafio " + (index + 1);

    const paragraph = document.createElement("p");
    paragraph.textContent = item.question;

    div.append(title, paragraph);
    questionsContainer.appendChild(div);
  });

  document.getElementById("review").textContent =
    output.review;

  document.getElementById("disclaimer").textContent =
    output.disclaimer;

  results.classList.remove("hidden");
});
</script>

</body>
</html>
